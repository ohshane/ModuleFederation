services:
  nginx:
    image: nginx
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./cert.pem:/etc/ssl/certs/cert.pem
      - ./key.pem:/etc/ssl/certs/key.pem
  host:
    build:
      context: .
      dockerfile: docker/web/Dockerfile.dev
      args:
        - SERVICE_DIR=host
    environment:
      - SERVICE_ID=host.ui
      - SERVICE_NAME=host
      - SERVICE_API_VERSION=v1
      - SERVICE_DB_SCHEMA=host
    volumes:
      - ./apps/host:/app/apps/host

  remote:
    build:
      context: .
      dockerfile: docker/web/Dockerfile.dev
      args:
        - SERVICE_DIR=remote
    environment:
      - SERVICE_ID=remote.ui
      - SERVICE_NAME=remote
      - SERVICE_API_VERSION=v1
      - SERVICE_DB_SCHEMA=remote
    volumes:
      - ./apps/remote:/app/apps/remote

networks:
  shared-net:
    name: net
